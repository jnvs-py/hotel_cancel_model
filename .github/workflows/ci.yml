# Plantilla u_calidad_python. Copiar a .github/workflows/ci.yml
# La gracia no es correr los tests: es correrlos en una maquina limpia.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sincronizar dependencias desde el lock
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Formato
        run: uv run ruff format --check .

      - name: Tests con cobertura
        run: uv run pytest --cov=src --cov-fail-under=80

      - name: Verificar salida en terminal legacy
        run: PYTHONIOENCODING=cp1252 uv run python -c "import src.config"

  docker:
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      - name: Sincronizar dependencias
        run: uv sync --frozen

      # El modelo es artefacto de build: se entrena ANTES de construir la imagen.
      - name: Entrenar el modelo
        run: uv run python -m src.train

      - name: Construir imagen
        run: docker build --platform linux/amd64 -t hito1-reservas:ci .

      - name: Arrancar el contenedor
        run: docker run -d --name api -p 8000:8000 -e PORT=8000 hito1-reservas:ci

      - name: Esperar a que este listo
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "El contenedor no respondio en 30s. Logs:"
          docker logs api
          exit 1

      - name: Probar la prediccion
        run: |
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d @tests/fixtures/request_ejemplo.json
