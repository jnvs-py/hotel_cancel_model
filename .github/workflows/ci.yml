# Plantilla u_calidad_python. Copiar a .github/workflows/ci.yml
# La gracia no es correr los tests: es correrlos en una maquina limpia.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sincronizar dependencias desde el lock
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Formato
        run: uv run ruff format --check .

      - name: Tests con cobertura
        run: uv run pytest --cov=src --cov-fail-under=80

      - name: Verificar salida en terminal legacy
        run: PYTHONIOENCODING=cp1252 uv run python -c "import src.config"

  docker:
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      - name: Sincronizar dependencias
        run: uv sync --frozen

      # El modelo es artefacto de build: se entrena ANTES de construir la imagen.
      # La version se DERIVA aqui (pyproject + sha de git) y el fingerprint
      # identifica todo lo que afecta al entrenamiento: codigo, datos y lock.
      - name: Derivar version del modelo
        run: |
          BASE=$(grep -m1 '^version' pyproject.toml | cut -d '"' -f2)
          SHA=$(git rev-parse --short HEAD)
          FP=$(git ls-files src data pyproject.toml uv.lock | xargs sha256sum | sha256sum | cut -c1-16)
          echo "MODEL_VERSION=${BASE}+${SHA}" >> "$GITHUB_ENV"
          echo "FINGERPRINT=${FP}" >> "$GITHUB_ENV"

      - name: Entrenar el modelo
        run: uv run python -m src.train

      - name: Construir imagen
        run: docker build --platform linux/amd64 -t hito1-reservas:ci .

      - name: Arrancar el contenedor
        run: docker run -d --name api -p 8000:8000 -e PORT=8000 hito1-reservas:ci

      - name: Esperar a que este listo
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "El contenedor no respondio en 30s. Logs:"
          docker logs api
          exit 1

      - name: Probar la prediccion
        run: |
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d @tests/fixtures/request_ejemplo.json

      # Gate de observabilidad (paso S9): la instrumentacion debe viajar en la
      # imagen, no solo en el entorno de desarrollo.
      - name: Verificar la prediccion de referencia (AC-011)
        run: |
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d @tests/fixtures/request_ejemplo.json > /tmp/respuesta.json
          cat /tmp/respuesta.json; echo
          python - <<'EOF'
          import json

          cuerpo = json.load(open("/tmp/respuesta.json"))
          assert cuerpo["prediction"] == "Not_Canceled", cuerpo
          assert abs(cuerpo["probability"] - 0.0923) < 1e-6, cuerpo
          assert cuerpo["threshold"] == 0.67, cuerpo
          assert set(cuerpo) == {
              "prediction", "probability", "threshold", "model_version", "request_id"
          }, cuerpo
          print("Prediccion de referencia OK (AC-011)")
          EOF
        shell: bash

      - name: Verificar el formulario en /app
        run: |
          # Sin redirect (FileResponse directo): un curl simple debe ver el HTML.
          curl -sf http://localhost:8000/app | grep -q "<form" \
            || { echo "El formulario no se sirve en /app"; exit 1; }
          curl -sf http://localhost:8000/app | grep -q 'name="lead_time"' \
            || { echo "El formulario no tiene los campos del contrato"; exit 1; }
          CURVA=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/)
          [ "$CURVA" = "307" ] || { echo "La raiz deberia redirigir (307), dio $CURVA"; exit 1; }
          echo "OK: formulario servido y raiz redirigiendo"

      - name: Verificar /metrics y el evento prediction
        run: |
          echo "== metricas =="
          curl -sf http://localhost:8000/metrics | grep -q "ml_requests_total" \
            || { echo "Falta ml_requests_total en /metrics"; exit 1; }
          curl -sf http://localhost:8000/metrics | grep -q "ml_model_loaded" \
            || { echo "Falta ml_model_loaded en /metrics"; exit 1; }
          echo "== evento de auditoria en los logs =="
          docker logs api 2>&1 | grep -q '"event": "prediction"' \
            || { echo "No hay evento prediction en los logs del contenedor"; docker logs api; exit 1; }
          docker logs api 2>&1 | grep -q '"model_version"' \
            || { echo "El evento no lleva model_version"; exit 1; }
          echo "OK: metricas y auditoria presentes"
